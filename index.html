<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💘 520 专属表白</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heart-container">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>

        <div class="card">
            <h1 class="title">亲爱的 ❤️</h1>
            <p class="subtitle">我有话想对你说...</p>
            
            <div class="message-box">
                <p class="message">
                    从遇见你的那一刻起，
                    <br>我的生命就变得不再平凡。
                    <br><br>
                    你的微笑是我每天最期待的阳光，
                    <br>你的声音是我听过最美的旋律。
                    <br><br>
                    我想告诉你：
                    <br><span class="highlight">我喜欢你</span>，
                    <br>不止一点点，
                    <br>是很喜欢很喜欢的那种。
                </p>
            </div>

            <div class="countdown">
                <div class="countdown-item">
                    <span class="countdown-num">5</span>
                    <span class="countdown-text">2</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-num">0</span>
                    <span class="countdown-text">0</span>
                </div>
            </div>

            <div class="buttons">
                <button class="btn-yes" onclick="showLove()">我也喜欢你 💖</button>
                <button class="btn-no" onclick="playGame()">再考虑一下...</button>
            </div>

            <div class="confetti" id="confetti"></div>
        </div>

        <div class="stars">
            <span class="star">✨</span>
            <span class="star">⭐</span>
            <span class="star">✨</span>
            <span class="star">⭐</span>
            <span class="star">✨</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
