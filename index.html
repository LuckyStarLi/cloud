<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI婚姻匹配系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💝 AI 婚姻匹配系统</h1>
            <p class="subtitle">基于大模型语义理解的极简婚恋匹配</p>
        </header>

        <section id="step1" class="step active">
            <h2>第一步：注册信息</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">你的昵称</label>
                    <input type="text" id="name" name="name" required placeholder="输入你的昵称">
                </div>
                <div class="form-group">
                    <label for="gender">性别</label>
                    <select id="gender" name="gender" required>
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">年龄</label>
                    <input type="number" id="age" name="age" required min="18" max="100" placeholder="输入你的年龄">
                </div>
                <div class="form-group">
                    <label for="intro">自我介绍（自由文本）</label>
                    <textarea id="intro" name="intro" required rows="5" placeholder="介绍一下你自己，你的性格、爱好、工作、生活态度等..."></textarea>
                </div>
                <div class="form-group">
                    <label for="preference">择偶偏好（自由文本）</label>
                    <textarea id="preference" name="preference" required rows="5" placeholder="描述你理想中的另一半，性格、爱好、生活方式等..."></textarea>
                </div>
                <button type="submit" class="btn-primary">开始匹配</button>
            </form>
        </section>

        <section id="step2" class="step">
            <h2>第二步：匹配结果</h2>
            <div id="matchResults" class="results-container"></div>
            <button id="backToRegister" class="btn-secondary">返回修改</button>
        </section>

        <section id="step3" class="step">
            <h2>第三步：双向确认</h2>
            <div id="confirmContent" class="confirm-container"></div>
            <button id="startOver" class="btn-primary">重新开始</button>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 AI 婚姻匹配系统. 极简设计，用心匹配。</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
